name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A money system gets no "it passed locally": every gate below must be green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FMS_SECRET_KEY: ci-secret-key-0123456789-abcdefghijklmnop
  FMS_ENV: ci

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy --strict app scripts

      - name: Tests
        run: pytest -q
        env:
          FMS_DATABASE_URL: "sqlite://"

      - name: OpenAPI document is up to date
        run: python scripts/export_openapi.py --check

  backend-postgres:
    name: Backend against PostgreSQL 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite runs on SQLite for speed; this job proves the same assertions hold on
    # the production engine, where money is NUMERIC and the triggers are PL/pgSQL.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fms
          POSTGRES_PASSWORD: fms
          POSTGRES_DB: fms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fms -d fms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Migration runs up and down on PostgreSQL
        env:
          FMS_DATABASE_URL: postgresql+psycopg://fms:fms@localhost:5432/fms
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Schema and append-only assertions against PostgreSQL
        env:
          FMS_DATABASE_URL: postgresql+psycopg://fms:fms@localhost:5432/fms
          FMS_MIGRATION_TEST_URL: postgresql+psycopg://fms:fms@localhost:5432/fms
        run: pytest tests/test_migrations.py -q

      - name: Seed loads cleanly
        env:
          FMS_DATABASE_URL: postgresql+psycopg://fms:fms@localhost:5432/fms
        run: python -m scripts.seed --password 'Ci-Seeded-Pass-1!'

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generated API types match the committed OpenAPI document
        run: |
          npm run generate:api
          git diff --exit-code -- types/api.d.ts \
            || (echo "::error::types/api.d.ts is stale; run npm run generate:api" && exit 1)

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fms
          POSTGRES_PASSWORD: fms
          POSTGRES_DB: fms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fms -d fms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      FMS_DATABASE_URL: postgresql+psycopg://fms:fms@localhost:5432/fms
      FMS_SEED_PASSWORD: E2e-Seeded-Pass-1!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Migrate and seed
        working-directory: backend
        run: |
          alembic upgrade head
          python -m scripts.seed --password "$FMS_SEED_PASSWORD"

      - name: Start the API
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done

      - name: Install the frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # - name: Run the end-to-end scenarios
      #   working-directory: frontend
      #   env:
      #     FMS_API_URL: http://127.0.0.1:8000/api/v1
      #   run: npm run e2e

      - name: Keep the logs when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            backend/api.log
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install paramiko
        run: pip install paramiko

      - name: Run deploy/deploy.py over SSH
        env:
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: python deploy/deploy.py
