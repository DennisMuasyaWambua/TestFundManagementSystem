# Local development: the API, the web app, the scheduled worker, PostgreSQL and
# Redis. One command brings up a system seeded with the chart of accounts, the
# starter users and the two go-live mandates.
#
#   docker compose up --build
#   docker compose run --rm api python -m scripts.seed --password "Local-Dev-Pass-1!"
#
# Nothing here is production configuration: the secrets are obvious placeholders
# on purpose, and TLS terminates in front of this stack in a real environment.

name: fms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fms
      POSTGRES_PASSWORD: fms
      POSTGRES_DB: fms
      # Deterministic collation, so ORDER BY on a reference never differs by host.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fms -d fms"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # Present for the Celery option; the v1 worker uses APScheduler in-process.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ./backend
    environment: &api-env
      FMS_ENV: local
      FMS_DATABASE_URL: postgresql+psycopg://fms:fms@postgres:5432/fms
      FMS_SECRET_KEY: local-development-only-change-me-0123456789
      FMS_FILE_STORE_PATH: /app/var/files
      FMS_REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - file-store:/app/var/files

  seed:
    build:
      context: ./backend
    environment: *api-env
    # Idempotent: loads the chart of accounts, the role mappings, the starter users
    # and the two client mandates, skipping anything already present.
    command: ["python", "-m", "scripts.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - file-store:/app/var/files

  api:
    build:
      context: ./backend
    environment: *api-env
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - file-store:/app/var/files

  worker:
    build:
      context: ./backend
    environment: *api-env
    # Daily accruals and the month-end revaluation. Closing a period stays a
    # deliberate act by finance, so the worker never does it.
    command: ["python", "-m", "app.jobs.worker"]
    depends_on:
      api:
        condition: service_started
    volumes:
      - file-store:/app/var/files

  web:
    build:
      context: ./frontend
    environment:
      NODE_ENV: production
      # Server-side only: the browser never learns this address.
      FMS_API_URL: http://api:8000/api/v1
      # Fixed so Server Action IDs survive a container restart -- otherwise Next.js
      # generates a new random key each start and any open tab's bound actions
      # (e.g. the login form) start failing with "Failed to find Server Action".
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: HAAktHXqHQ8zgLY5qJZwJ6vNiL+olBxJ0MK5Q1FmvNM=
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  file-store:
