[project]
name = "fms-backend"
version = "1.0.0"
description = "Shariah fund management system - double-entry ledger, custody instructions, reporting"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.17",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=43.0",
  "reportlab>=4.2",
  "openpyxl>=3.1",
  "APScheduler>=3.10",
  "redis>=5.2",
  "celery>=5.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.112",
  "httpx>=0.27",
  "mypy>=1.13",
  "ruff>=0.7",
  "types-passlib",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "N", "RUF", "ASYNC"]
ignore = ["B008", "RUF012", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"alembic/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_decorators = false
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "pyotp.*", "openpyxl.*", "apscheduler.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = ["golden: golden-number acceptance tests from section 12"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
