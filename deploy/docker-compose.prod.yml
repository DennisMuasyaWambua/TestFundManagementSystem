# Production deployment for srv100 (172.17.0.100).
#
# This server already runs another system (the Go "salaam-fund" build, in
# ~/apps/backend and ~/apps/frontend, on ports 3000/8081 behind nginx :80/:443/:8080/
# :8443). This stack is deliberately isolated from it:
#   - its own Compose project name ("fms"), so container and network names never
#     collide with backend_default / frontend_default;
#   - its own ports, bound to 127.0.0.1 only, exactly like the other system's
#     containers -- nginx is what makes either one reachable from outside;
#   - its own named volumes and its own Postgres, with no host port exposed at all
#     (not even on loopback), so it can never collide with the other system's
#     Postgres on 127.0.0.1:5432.
#
# Run from the project root on the server (the directory this file's parent sits
# in), with: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env
# -p fms up -d --build

name: fms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-fms}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - fms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No ports: entrypoint-only. Nothing outside this compose project can reach it.

  migrate:
    build:
      context: ../backend
    environment: &api-env
      FMS_ENV: production
      FMS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fms}
      FMS_SECRET_KEY: ${FMS_SECRET_KEY:?Set FMS_SECRET_KEY in deploy/.env}
      FMS_FILE_STORE_PATH: /app/var/files
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - fms_file_store:/app/var/files

  seed:
    build:
      context: ../backend
    environment: *api-env
    # Idempotent: creates the chart of accounts, role mappings, starter users and
    # the two go-live mandates if they are not already there, and does nothing
    # otherwise. Safe to run on every deploy.
    command: ["python", "-m", "scripts.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - fms_file_store:/app/var/files

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment: *api-env
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      # Loopback only; nginx exposes it externally -- see deploy/nginx-fms.conf.
      - "127.0.0.1:${API_PORT:-8101}:8000"
    volumes:
      - fms_file_store:/app/var/files
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    environment: *api-env
    command: ["python", "-m", "app.jobs.worker"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - fms_file_store:/app/var/files

  web:
    build:
      context: ../frontend
      args:
        # Baked into the build -- fixed here across redeploys so a rebuild doesn't
        # mint new Server Action IDs and break any browser tab still holding the
        # old ones (seen as "Failed to find Server Action").
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?Set NEXT_SERVER_ACTIONS_ENCRYPTION_KEY in deploy/.env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side only: the browser never learns this address. Reached over the
      # compose network's own DNS, not through nginx.
      FMS_API_URL: http://api:8000/api/v1
      # Docker sets its own HOSTNAME to the container ID, and the standalone
      # server.js does `process.env.HOSTNAME || '0.0.0.0'` -- without this
      # override it binds only to the container's own IP, never 127.0.0.1, which
      # fails the image's HEALTHCHECK (it curls 127.0.0.1 from inside).
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Loopback only; nginx exposes it externally -- see deploy/nginx-fms.conf.
      - "127.0.0.1:${WEB_PORT:-3100}:3000"

volumes:
  fms_postgres_data:
  fms_file_store:
