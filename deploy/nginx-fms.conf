# nginx site for the Shariah fund management system (Python/FastAPI + Next.js),
# installed as /etc/nginx/sites-available/fms on srv100.
#
# Deliberately a SEPARATE file from the existing /etc/nginx/sites-available/
# salaam-fund: it is never edited, only read, by this deployment. This site uses
# ports nothing else on the box listens on (8090/8543 for the web app, 9080/9443
# for the API), so both sites keep working side by side.
#
# TLS reuses the server's existing private-CA certificate (the same one
# salaam-fund uses) via the shared snippet -- that is just serving the same host
# identity on a different port, not a change to anything salaam-fund depends on.

map $http_upgrade $connection_upgrade_fms {
    default upgrade;
    ''      close;
}

# ---------- Web (Next.js) ----------
server {
    listen 8090;
    listen [::]:8090;
    server_name _;
    return 301 https://$host:8543$request_uri;
}

server {
    listen 8543 ssl;
    listen [::]:8543 ssl;
    http2 on;
    server_name _;
    include snippets/salaam-tls.conf;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        # $host drops the port, but this site runs on a non-default port (8543) and
        # the browser's Origin header keeps it -- Next.js's Server Actions guard
        # compares the two and aborts the request on a mismatch. $http_host is the
        # Host header exactly as the browser sent it, port included.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_fms;
        proxy_read_timeout 300s;
        # Next.js streams responses; buffering would hold them back.
        proxy_buffering off;
    }
}

# ---------- API (FastAPI) ----------
# Optional in normal use -- the web app reaches the API over the Docker network,
# never through nginx -- but useful for health checks and browsing /docs directly.
server {
    listen 9080;
    listen [::]:9080;
    server_name _;
    return 301 https://$host:9443$request_uri;
}

server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    http2 on;
    server_name _;
    include snippets/salaam-tls.conf;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
